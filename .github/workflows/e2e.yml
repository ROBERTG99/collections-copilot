# The full compose stack, seeded, then Playwright with axe on every screen.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_LLM_PROVIDER: fake

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Stack (healthy within the 300 s budget)
        run: make up
      - run: make seed
      - name: Chromium for Playwright
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - run: make e2e
      - name: Screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e
          path: |
            docs/images/*.png
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Stop the stack
        if: always()
        run: make down
