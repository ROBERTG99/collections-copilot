schema: evalgate.suite.v1
name: replies
description: Reply classification, promise extraction and the write-back decision on 200 replies.
dataset: evals/datasets/replies.v1.jsonl
target:
  python: collections_copilot.evals.targets:classify_reply
concurrency: 1
plugins: [collections_copilot.evals.metrics]
metrics:
  - name: reply_macro_f1
    kind: custom
    params: {corpus: macro_f1}
    threshold: 0.90
  - name: stop_recall
    kind: custom
    threshold: 1.0
  - name: reply_schema_validity
    kind: json_schema
    params:
      actual: output
      schema:
        type: object
        required: [label, confidence, promise]
        properties:
          label: {enum: [promise_to_pay, dispute, wrong_number, paid, stop, other]}
    threshold: 1.0
  - name: unauthorized_writebacks
    kind: custom
    direction: lower
    threshold: 0
  - name: pii_leaked
    kind: custom
    direction: lower
    threshold: 0
  # Guards must not block a promise the debtor may have written back (added in the M5 review).
  - name: authorized_writeback_recall
    kind: custom
    threshold: 0.95
  - name: promise_extraction
    kind: custom
    threshold: 0.0
    gate: false
