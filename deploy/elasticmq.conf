include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats.enabled = false

queues {
  cc-tasks-dlq { defaultVisibilityTimeout = 60 seconds }
  cc-replies-dlq { defaultVisibilityTimeout = 60 seconds }
  cc-tasks {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "cc-tasks-dlq", maxReceiveCount = 5 }
  }
  cc-replies {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "cc-replies-dlq", maxReceiveCount = 5 }
  }
}
