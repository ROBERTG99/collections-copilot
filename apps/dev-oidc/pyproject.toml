[project]
name = "dev-oidc"
version = "0.1.0"
description = "Cognito-compatible OIDC double for local development (synthetic personas)."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.143", "uvicorn>=0.54", "pyjwt[crypto]>=2.15", "cryptography>=50", "python-multipart>=0.0.32"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_oidc"]
