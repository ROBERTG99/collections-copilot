# The five shipped images build, pass hadolint, and have no fixable high or critical CVE (§12, §17).
name: docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [docker/python.Dockerfile, web/Dockerfile]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, file: docker/python.Dockerfile, target: api }
          - { name: worker, file: docker/python.Dockerfile, target: worker }
          - { name: ledger-mcp, file: docker/python.Dockerfile, target: ledger-mcp }
          - { name: mcp-gateway, file: docker/python.Dockerfile, target: mcp-gateway }
          - { name: web, file: web/Dockerfile, target: web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: collections-copilot/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Non-root with a health check
        env:
          IMAGE: collections-copilot/${{ matrix.name }}:ci
        run: |
          user=$(docker image inspect "$IMAGE" --format '{{.Config.User}}')
          health=$(docker image inspect "$IMAGE" --format '{{json .Config.Healthcheck}}')
          echo "user=$user healthcheck=$health"
          test "$user" = "10001"
          test "$health" != "null"
      - name: trivy (fails on fixable high or critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db
          TRIVY_JAVA_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-java-db
        with:
          scan-type: image
          image-ref: collections-copilot/${{ matrix.name }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
