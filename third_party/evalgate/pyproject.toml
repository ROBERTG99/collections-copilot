[project]
name = "evalgate"
version = "0.1.0"
description = "Subset of evalgate v0.1.0 contracts used by collections-copilot (fallback; see docs/DECISIONS.md)."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14", "pyyaml>=6.0", "typer>=0.27"]

[project.scripts]
evalgate = "evalgate.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgate"]
