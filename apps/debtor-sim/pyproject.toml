[project]
name = "debtor-sim"
version = "0.1.0"
description = "Demo-only debtor simulator: reads the WireMock journal and posts signed Twilio callbacks."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28", "twilio>=9.12"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debtor_sim"]
