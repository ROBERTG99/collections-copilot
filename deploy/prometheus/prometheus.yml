# Profile `observability`: scrapes the API and the worker (§14).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: cc-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8310"]
  - job_name: cc-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8311"]
