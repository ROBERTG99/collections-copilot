# Lint, types, unit, integration, contract and harness tests with the coverage gates.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CC_LLM_PROVIDER: fake
  TERRAFORM_VERSION: "1.16.6"

jobs:
  security:
    # The scanners that need no images or cloud tooling; `make security` runs the full set.
    name: secrets and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: ./.github/actions/setup
      - name: gitleaks (whole history)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git . --redact --no-banner --exit-code 1
      - name: pip-audit (locked runtime dependencies)
        run: |
          uv export --frozen --no-hashes --no-emit-workspace --no-dev --format requirements-txt > "$RUNNER_TEMP/req.txt"
          uvx --from pip-audit==2.9.0 pip-audit -r "$RUNNER_TEMP/req.txt" --no-deps --disable-pip --progress-spinner off
      - name: pip-audit (locked dev dependencies)
        run: |
          uv export --frozen --no-hashes --no-emit-workspace --only-group dev --no-emit-package evalgate --format requirements-txt > "$RUNNER_TEMP/req-dev.txt"
          uvx --from pip-audit==2.9.0 pip-audit -r "$RUNNER_TEMP/req-dev.txt" --no-deps --disable-pip --progress-spinner off
      - name: pnpm audit
        working-directory: web
        run: pnpm audit --audit-level high

  lint:
    name: lint and types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - run: make lint
      - run: make typecheck

  test:
    name: unit, integration, contract, harness
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Starts the compose dependencies, runs the suites with coverage and both coverage gates.
      - run: make test
      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            web/coverage/lcov.info
          if-no-files-found: ignore
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
