[project]
name = "ledger-mcp"
version = "0.1.0"
description = "Synthetic ledger exposed as an MCP server over Streamable HTTP."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["mcp>=2.3", "psycopg[binary,pool]>=3.3", "uvicorn>=0.54", "starlette>=0.40"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger_mcp"]
